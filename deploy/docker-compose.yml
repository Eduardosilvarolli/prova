services:
  postgres:
    image: postgres:16-alpine
    container_name: events-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: events
      POSTGRES_PASSWORD: events_password
      POSTGRES_DB: events_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - api-db
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U events -d events_db"]
      interval: 5s
      timeout: 5s
      retries: 10
  api:
    build:
      context: ../api
    container_name: events-api
    restart: unless-stopped
    environment:
      PORT: 3000
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: events
      DB_PASSWORD: events_password
      DB_NAME: events_db
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - api-db
      - api-front
  front:
    build:
      context: ../front
    container_name: events-front
    restart: unless-stopped
    ports:
      - "5173:5173"
    depends_on:
      - api
    networks:
      - api-front
volumes:
  postgres_data:
    name: events_postgres_data
networks:
  api-db:
    name: events_api_db
  api-front:
    name: events_api_front
